    <style>
      /* Critical loader styles to prevent any unstyled flash */
      .loader-overlay {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #03030f;
        overflow: hidden;
        transition: opacity 0.3s ease;
      }
      .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .loader-rings {
        position: relative;
        width: 220px;
        height: 220px;
      }
      .loader-rings .ring {
        position: absolute;
        inset: 0;
        box-sizing: border-box;
        border: 5px solid transparent;
        border-radius: 50%;
        background: transparent;
        will-change: transform;
      }
      .loader-rings .ring-1 {
        border-color: #ffffff;
        transform: rotate(0deg) scaleX(0.91);
        animation: ring-one 5s linear infinite;
      }
      .loader-rings .ring-2 {
        border-color: #ef5a50;
        transform: rotate(25deg) scaleX(0.87) scaleY(0.96);
        animation: ring-two 6s linear infinite;
      }
      .loader-rings .ring-3 {
        border-color: #423cff;
        transform: rotate(-35deg) scaleX(0.94) scaleY(0.91);
        animation: ring-three 7s linear infinite;
      }
      .loader-rings .ring-4 {
        border-color: #38bd80;
        transform: rotate(55deg) scaleX(0.89) scaleY(0.95);
        animation: ring-four 5.5s linear infinite;
      }
      .loader-rings .ring-5 {
        border-color: #9b46d4;
        transform: rotate(-60deg) scaleX(0.96) scaleY(0.88);
        animation: ring-five 6.5s linear infinite;
      }
      .loader-rings .ring-6 {
        border-color: #e7c44a;
        border-width: 4px;
        transform: rotate(80deg) scaleX(0.92) scaleY(0.97);
        animation: ring-six 7.5s linear infinite;
      }
      @keyframes ring-one {
        from { transform: rotate(0deg) scaleX(0.91); }
        to   { transform: rotate(360deg) scaleX(0.91); }
      }
      @keyframes ring-two {
        from { transform: rotate(25deg) scaleX(0.87) scaleY(0.96); }
        to   { transform: rotate(-335deg) scaleX(0.87) scaleY(0.96); }
      }
      @keyframes ring-three {
        from { transform: rotate(-35deg) scaleX(0.94) scaleY(0.91); }
        to   { transform: rotate(325deg) scaleX(0.94) scaleY(0.91); }
      }
      @keyframes ring-four {
        from { transform: rotate(55deg) scaleX(0.89) scaleY(0.95); }
        to   { transform: rotate(415deg) scaleX(0.89) scaleY(0.95); }
      }
      @keyframes ring-five {
        from { transform: rotate(-60deg) scaleX(0.96) scaleY(0.88); }
        to   { transform: rotate(-420deg) scaleX(0.96) scaleY(0.88); }
      }
      @keyframes ring-six {
        from { transform: rotate(80deg) scaleX(0.92) scaleY(0.97); }
        to   { transform: rotate(-280deg) scaleX(0.92) scaleY(0.97); }
      }
      .loader-text {
        margin: 55px 0 0;
        color: #ffffff;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 32px;
        font-weight: 400;
        letter-spacing: -0.5px;
        line-height: 1.2;
      }
      @media (max-width: 600px) {
        .loader-rings {
          width: 175px;
          height: 175px;
        }
        .loader-rings .ring {
          border-width: 4px;
        }
        .loader-text {
          margin-top: 38px;
          font-size: 27px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .loader-rings .ring {
          animation: none !important;
        }
      }
    </style>

  <body>
    <!-- Initial Loading Screen (dismissed cleanly when app loads) -->
    <div class="loader-overlay" id="loader" role="status" aria-live="polite" aria-label="Loading">
      <div class="loader-content">
        <div class="loader-rings">
          <span class="ring ring-1"></span>
          <span class="ring ring-2"></span>
          <span class="ring ring-3"></span>
          <span class="ring ring-4"></span>
          <span class="ring ring-5"></span>
          <span class="ring ring-6"></span>
        </div>

        <p class="loader-text">Loading</p>
      </div>
    </div>

    <div id="root"></div>

    <script>
      window.addEventListener("load", () => {
        const loader = document.getElementById("loader");
        if (loader) {
          loader.style.opacity = "0";
          setTimeout(() => {
            loader.style.display = "none";
          }, 300);
        }
      });
    </script>
  </body>
